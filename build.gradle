plugins {
    id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.15.3' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.141' apply false
}

def minecraftTarget = providers.gradleProperty('mc_target').orElse('1.21.x').get()
def minecraftTargetFile = file("gradle/minecraft-versions/${minecraftTarget}.properties")

if (!minecraftTargetFile.exists()) {
    throw new GradleException("Unknown mc_target '${minecraftTarget}'. Expected a file in gradle/minecraft-versions.")
}

def minecraftTargetProperties = new Properties()
minecraftTargetFile.withInputStream { minecraftTargetProperties.load(it) }

allprojects {
    minecraftTargetProperties.each { key, value ->
        ext.set(key.toString(), value.toString())
    }
}

def releaseDir = layout.buildDirectory.dir('realese')
def minecraftTargets = fileTree('gradle/minecraft-versions') {
    include '*.properties'
}.files.collect { it.name - '.properties' }.sort()
def fabricReleaseTargets = ['1.21.x', '26.1.2'] as Set

tasks.register('cleanRealese', Delete) {
    group = 'build'
    description = 'Delete build/realese and loader jar outputs.'
    delete releaseDir
    delete subprojects.collect { subproject ->
        subproject.fileTree(subproject.layout.buildDirectory.dir('libs')) {
            include '*.jar'
        }
    }
}

def releaseBuildTasks = minecraftTargets.collect { target ->
    def taskSuffix = target.replaceAll(/[^A-Za-z0-9]/, '_')
    def loaders = fabricReleaseTargets.contains(target) ? ['fabric', 'forge', 'neoforge'] : ['forge', 'neoforge']
    tasks.register("buildRealese${taskSuffix}", GradleBuild) {
        group = 'build'
        description = "Build ${loaders.join(', ')} jars for Minecraft ${target}."
        buildName = "ImmersiveThunder-${taskSuffix}"
        startParameter.projectProperties = new LinkedHashMap<>(gradle.startParameter.projectProperties) + [mc_target: target]
        tasks = loaders.collect { ":${it}:build".toString() }
    }
}

releaseBuildTasks.eachWithIndex { taskProvider, index ->
    taskProvider.configure {
        mustRunAfter project.tasks.named('cleanRealese')
        if (index > 0) {
            mustRunAfter releaseBuildTasks[index - 1]
        }
    }
}

tasks.register('buildRealeseJars', Copy) {
    group = 'build'
    description = 'Build all release jars and copy them to build/realese by loader.'
    dependsOn tasks.named('cleanRealese')
    dependsOn releaseBuildTasks
    ['fabric', 'forge', 'neoforge'].each { loader ->
        from(project(":${loader}").layout.buildDirectory.dir('libs')) {
            include '*.jar'
            exclude '*-sources.jar', '*-javadoc.jar'
            into loader
        }
    }
    into releaseDir
}
